name: Exact certificate intake

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  exact-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never replace this base checkout with a PR checkout. Its Python is trusted.
      - name: Check out trusted validator and tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
          lfs: false

      # Treat every byte of this checkout as data, including any top-level files.
      - name: Check out submitted JSON data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: submitted
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout: |
            certificates
            submissions

      - name: Test trusted validator with independent oracle and corrupt controls
        working-directory: trusted
        run: python3 -I -B -m unittest discover -s tests -v

      - name: Verify submitted identities and emit pinned receipts
        # -I excludes submitted PYTHONPATH/current-directory imports; -B avoids bytecode writes.
        working-directory: trusted
        run: python3 -I -B scripts/verify_certificate.py --root ../submitted
